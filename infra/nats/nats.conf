# ==============================
# NATS configuration file
# ==============================

server_name: "n1"

# Client port
port: 4222

# JetStream storage (durable)
jetstream {
  store_dir: "/var/lib/nats/jetstream"
  max_mem_store: 1Gb
  max_file_store: 10Gb
}

# Monitoring endpoint (must be a scalar, not a map)
# Either of these two forms is valid; pick one:
# http: 8222
http: "0.0.0.0:8222"

# Enable this cluster block later if needed
# cluster {
#   name: "uitgo-nats"
#   listen: "0.0.0.0:6222"
#   routes: [
#     nats-route://n2:6223,
#     nats-route://n3:6224
#   ]
# }

# Logging
debug: false
trace: false
logtime: true
