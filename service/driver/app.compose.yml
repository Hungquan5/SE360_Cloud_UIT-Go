services:
  svc:
    build: .
    env_file: .env
    environment:
      APP_PORT: "8080"
      REDIS_ADDR: redis://redis:6379
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - drivernet
    restart: unless-stopped

networks:
  drivernet:
    external: true
