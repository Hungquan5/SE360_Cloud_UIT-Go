version: "3.9"

networks:
  drivernet:  # must match the one used by services
    name: drivernet

volumes:
  redis_data: {}

services:
  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"            # expose only if you need to inspect
    volumes:
      - "redis_data:/data"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - drivernet
networks:
  drivernet:
    external: true
