# infra.compose.yml
version: "3.9"

networks:
  appnet:
    name: appnet

volumes:
  pgdata:

services:
  db:
    image: postgres:16-alpine
    container_name: pg
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: password
      POSTGRES_DB: appdb_user
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro   # ⬅️ run SQL on first init
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appdb_user"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [appnet]

  # Optional: web SQL console at http://localhost:8080
  adminer:
    image: adminer:latest
    container_name: adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks: [appnet]

